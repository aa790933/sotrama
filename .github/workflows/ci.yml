  frappe-integration:
    name: Frappe 16.60.2 / ERPNext 16.60.0 / HRMS 16.60.0
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10
      redis-cache:
        image: redis:8-alpine
        ports:
          - 13000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10
      redis-queue:
        image: redis:8-alpine
        ports:
          - 11000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10
      redis-socketio:
        image: redis:8-alpine
        ports:
          - 12000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10
    steps:
      - name: Check out Sotrama
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install system and Bench dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libjpeg-dev libmariadb-dev libssl-dev mariadb-client pkg-config zlib1g-dev
          python -m pip install --upgrade pip frappe-bench
          npm install --global yarn@1.22.22

      - name: Initialize Bench with Frappe 16.60.2
        run: |
          bench init --skip-redis-config-generation --skip-assets --frappe-branch v16.60.2 --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install ERPNext, HRMS, and Sotrama
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --skip-assets --branch v16.60.0 erpnext
          bench get-app --skip-assets --branch v16.60.0 hrms
          bench get-app --skip-assets sotrama "$GITHUB_WORKSPACE"
          bench setup requirements --dev

      - name: Create test site and install apps
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site test_site --db-host 127.0.0.1 --db-port 3306 --db-root-password root --admin-password admin
          bench --site test_site install-app erpnext
          bench --site test_site install-app hrms
          bench --site test_site install-app sotrama
          bench --site test_site migrate
          bench --site test_site set-config allow_tests true

      - name: Compile Sotrama French translations
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site execute frappe.gettext.translate.compile_translations --kwargs "{'target_app': 'sotrama', 'locale': 'fr', 'force': True}"
          test -s sites/assets/locale/fr/LC_MESSAGES/sotrama.mo

      - name: Create an ERPNext company for Fleet integration tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site execute "frappe.get_doc({'doctype': 'Warehouse Type', 'name': 'Transit'}).insert(ignore_permissions=True) if not frappe.db.exists('Warehouse Type', 'Transit') else None"
          bench --site test_site execute "frappe.get_attr('erpnext.setup.setup_wizard.operations.company_setup.create_fiscal_year_and_company')({'company_name': 'Sotrama CI', 'company_abbr': 'SCI', 'currency': 'DZD', 'country': 'Algeria'})"

      - name: Run Sotrama server-side integration tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-tests --app sotrama
