name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install build and lint tools
        run: python -m pip install --upgrade pip build 'flit_core>=3.12,<4' ruff

      - name: Lint
        run: ruff check sotrama

      - name: Compile Python
        run: python -m compileall -q sotrama

      - name: Verify Frappe v16 server message calls
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          for path in Path("sotrama").rglob("*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8-sig"), filename=str(path))
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call):
                      continue
                  function = node.func
                  if not (isinstance(function, ast.Attribute) and function.attr == "msgprint"):
                      continue
                  assert not any(keyword.arg == "message" for keyword in node.keywords), (
                      f"{path}:{node.lineno}: Frappe v16 msgprint takes its message as the first positional argument"
                  )
          PY

      - name: Check and test Desk and Report scripts
        run: |
          for script in $(find sotrama -type f -name '*.js'); do
            node --check "$script"
          done
          node tests/js/test_fleet_form_permissions.js

      - name: Validate JSON metadata
        run: |
          python - <<'PY'
          import ast
          import json
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          app_init = ast.parse(Path("sotrama/__init__.py").read_text(encoding="utf-8"))
          app_version = next(
              node.value.value for node in app_init.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
          )
          assert app_version == "1.3.6", f"Expected Sotrama 1.3.6, found {app_version}"
          assert Path("tests/js/test_fleet_form_permissions.js").is_file()
          assert Path("sotrama/public/js/operational_task.js").is_file()
          assert project["project"]["requires-python"] == ">=3.14,<3.15"
          frappe_dependencies = project["tool"]["bench"]["frappe-dependencies"]
          for app in ("frappe", "erpnext", "hrms"):
              assert frappe_dependencies[app] == ">=16.60.0,<17.0.0"

          files = sorted(Path("sotrama").rglob("*.json"))
          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              if isinstance(data, dict) and "doctype" in data:
                  assert data.get("name"), f"Frappe record JSON is missing its name: {path}"
          print(f"Validated {len(files)} JSON files")

          settings = json.loads(Path("sotrama/sotrama/doctype/sotrama_settings/sotrama_settings.json").read_text(encoding="utf-8"))
          settings_fields = {field["fieldname"]: field for field in settings["fields"]}
          designation_setting = settings_fields["add_public_works_designations"]
          assert designation_setting["fieldtype"] == "Check"
          assert designation_setting["default"] == "0"
          assert designation_setting["permlevel"] == 1
          assert "Create Missing BTPH Designation Records" == designation_setting["label"]
          assert "does not create Employees, Drivers" in designation_setting["description"]
          assert any(permission["role"] == "HR Manager" and permission.get("permlevel", 0) == 1 and permission.get("write") for permission in settings["permissions"])

          designation_tree = ast.parse(Path("sotrama/designations.py").read_text(encoding="utf-8"))
          designation_assignment = next(
              node for node in designation_tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "PUBLIC_WORKS_DESIGNATIONS" for target in node.targets)
          )
          designations = ast.literal_eval(designation_assignment.value)
          designation_names = list(designations)
          assert len(designation_names) == 202, f"Expected 202 curated job titles, found {len(designation_names)}"
          assert len(designation_names) == len(set(designation_names)), "BTPH designation names must be unique"
          assert all(name and name == name.strip() for name in designation_names)
          assert (Path("sotrama/public/js/sotrama_settings.js")).is_file()
          hooks = ast.parse(Path("sotrama/hooks.py").read_text(encoding="utf-8"))
          doctype_js = next(
              node.value for node in hooks.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "doctype_js" for target in node.targets)
          )
          assert "Sotrama Settings" in ast.literal_eval(doctype_js)

          job_card = json.loads(Path("sotrama/tp/doctype/maintenance_job_card/maintenance_job_card.json").read_text(encoding="utf-8"))
          job_card_fields = {field["fieldname"]: field for field in job_card["fields"]}
          assert "ERPNext Item" in job_card_fields["parts_used"]["description"]
          assert "Frappe HR Employee" in job_card_fields["labour_lines"]["description"]
          job_card_print = json.loads(Path("sotrama/tp/print_format/maintenance_job_card_report/maintenance_job_card_report.json").read_text(encoding="utf-8"))
          assert job_card_print["print_format_builder_beta"] == 1
          job_card_print_layout = json.loads(job_card_print["format_data"])
          job_card_print_sections = {section["label"] for section in job_card_print_layout["sections"]}
          assert "Spare Parts (Stock Items)" in job_card_print_sections
          assert "Labour (Employees / Mechanics)" in job_card_print_sections
          for print_format_path in Path("sotrama/tp/print_format").glob("*/*.json"):
              print_format_record = json.loads(print_format_path.read_text(encoding="utf-8"))
              assert print_format_record["print_format_builder_beta"] == 1, print_format_path
              json.loads(print_format_record["format_data"])
          removed_hrms_apis = ("Daily Work Summary", "Daily Work Summary Group", "Identification Document Type", "hierarchy_chart")
          for source_path in Path("sotrama").rglob("*"):
              if source_path.is_file() and source_path.suffix in {".py", ".js", ".json", ".md"}:
                  source_text = source_path.read_text(encoding="utf-8")
                  for removed_api in removed_hrms_apis:
                      assert removed_api not in source_text, f"Removed HRMS API {removed_api} referenced in {source_path}"
          job_card_js = Path("sotrama/public/js/job_card.js").read_text(encoding="utf-8")
          assert "frm.perm?.[0]?.create" in job_card_js
          assert "frm.perm?.[0]?.write" in job_card_js
          assert "Add Spare Part (Item)" in job_card_js
          assert "Add Mechanic (Employee)" in job_card_js
          job_card_controller = Path("sotrama/tp/doctype/maintenance_job_card/maintenance_job_card.py").read_text(encoding="utf-8")
          assert "self._validate_labour_lines()" in job_card_controller
          assert "employee.company != self.company" in job_card_controller
          assert 'frappe.only_for(["System Manager", "Fleet Manager", "Workshop"])' in job_card_controller
          assert 'fields=["name", "employee_name", "designation"]' in job_card_controller
          assert "search_workshop_employees" in job_card_js
          assert "get_workshop_employee_name" in job_card_js
          assert "frappe.db.get_value('Employee'" not in job_card_js
          assert "parts_used_delete" in job_card_js
          assert "labour_lines_delete" in job_card_js
          assert "other_costs_delete" in job_card_js
          labour = json.loads(Path("sotrama/tp/doctype/job_card_labour/job_card_labour.json").read_text(encoding="utf-8"))
          labour_fields = {field["fieldname"]: field for field in labour["fields"]}
          assert labour_fields["mechanic"]["label"] == "Employee (Mechanic)"
          assert not labour_fields["mechanic"]["in_list_view"]
          assert labour_fields["mechanic_name"]["in_list_view"]
          driver = json.loads(Path("sotrama/tp/doctype/driver/driver.json").read_text(encoding="utf-8"))
          employee_link = next(field for field in driver["fields"] if field["fieldname"] == "employee")
          assert "Only HR Manager and System Manager" in employee_link["description"]
          assert "set_df_property('employee', 'read_only'" in Path("sotrama/public/js/driver.js").read_text(encoding="utf-8")
          driver_controller = Path("sotrama/tp/doctype/driver/driver.py").read_text(encoding="utf-8")
          assert 'frappe.only_for(["System Manager", "HR Manager"])' in driver_controller
          inspection_js = Path("sotrama/public/js/inspection.js").read_text(encoding="utf-8")
          assert "frm.perm?.[0]?.create" in inspection_js
          assert "frm.perm?.[0]?.write" in inspection_js
          assert "Add Inspection Check" in inspection_js
          assert "inspection_items_add" in inspection_js
          assert "inspection_items_delete" in inspection_js
          assert "search_workshop_employees" in inspection_js
          inspection_item = json.loads(Path("sotrama/tp/doctype/inspection_item/inspection_item.json").read_text(encoding="utf-8"))
          inspection_status = next(field for field in inspection_item["fields"] if field["fieldname"] == "status")
          assert inspection_status["default"] == "Not Checked"
          assert "Not Checked" in inspection_status["options"]
          inspection_controller = Path("sotrama/tp/doctype/vehicle_inspection/vehicle_inspection.py").read_text(encoding="utf-8")
          assert "_validate_items(require_completed=True)" in inspection_controller
          assert '"Conditional Pass"' in inspection_controller
          inspection = json.loads(Path("sotrama/tp/doctype/vehicle_inspection/vehicle_inspection.json").read_text(encoding="utf-8"))
          assert next(field for field in inspection["fields"] if field["fieldname"] == "overall_status")["read_only"]
          inspection_permissions = inspection["permissions"]
          for role in ("Fleet Manager", "System Manager"):
              assert any(row["role"] == role and row.get("permlevel") == 1 and row.get("read") and row.get("write") for row in inspection_permissions)
          inspection_item = json.loads(Path("sotrama/tp/doctype/inspection_item/inspection_item.json").read_text(encoding="utf-8"))
          assert next(field for field in inspection_item["fields"] if field["fieldname"] == "is_safety_critical")["permlevel"] == 1
          assert "_enforce_safety_critical_flags" in inspection_controller
          assert "_ensure_standard_checklist" in inspection_controller
          assert "STANDARD_INSPECTION_CHECKS" in inspection_controller
          assert "row.is_safety_critical = 1" in inspection_js
          operational_task_js = Path("sotrama/public/js/operational_task.js").read_text(encoding="utf-8")
          assert "search_workshop_employees" in operational_task_js
          assert '"Operational Task": "public/js/operational_task.js"' in Path("sotrama/hooks.py").read_text(encoding="utf-8")

          workshop_read_only = ("vehicle", "driver", "operational_task", "maintenance_schedule", "maintenance_job_type", "vehicle_make", "vehicle_model")
          for doctype_name in workshop_read_only:
              doctype_path = Path("sotrama/tp/doctype") / doctype_name / f"{doctype_name}.json"
              doctype_data = json.loads(doctype_path.read_text(encoding="utf-8"))
              workshop = next(row for row in doctype_data["permissions"] if row["role"] == "Workshop" and row.get("permlevel", 0) == 0)
              assert workshop.get("read") == 1, doctype_name
              for action in ("write", "create", "delete", "submit", "cancel", "amend"):
                  assert not workshop.get(action, 0), f"Workshop unexpectedly has {action} on {doctype_name}"
          for doctype_name in ("maintenance_job_card", "vehicle_inspection", "breakdown_incident"):
              doctype_data = json.loads((Path("sotrama/tp/doctype") / doctype_name / f"{doctype_name}.json").read_text(encoding="utf-8"))
              workshop = next(row for row in doctype_data["permissions"] if row["role"] == "Workshop" and row.get("permlevel", 0) == 0)
              assert workshop.get("write") and workshop.get("create") and workshop.get("submit")
              assert not workshop.get("cancel", 0), doctype_name
          vehicle = json.loads(Path("sotrama/tp/doctype/vehicle/vehicle.json").read_text(encoding="utf-8"))
          vehicle_fields = {field["fieldname"]: field for field in vehicle["fields"]}
          for fieldname in ("acquisition_date", "acquisition_value", "current_value", "depreciation_rate", "salvage_value", "insurance_value", "asset"):
              assert vehicle_fields[fieldname]["permlevel"] == 1
          driver_fields = {field["fieldname"]: field for field in driver["fields"]}
          assert driver_fields["employee"]["permlevel"] == 3
          assert not driver_fields["employee"].get("in_list_view")
          for fieldname in ("phone", "email", "license_class", "license_expiry", "total_incidents", "notes"):
              assert driver_fields[fieldname]["permlevel"] == 2
          for fieldname in ("address", "hire_date", "license_number", "license_issue_date"):
              assert driver_fields[fieldname]["permlevel"] == 1
          assert "personal number" in driver_fields["phone"].get("description", "")
          assert "personal email" in driver_fields["email"].get("description", "")
          for fieldname in ("medical_expiry", "safety_training_expiry", "professional_certificate", "professional_certificate_number", "compliance_records", "date_of_birth", "national_id"):
              assert driver_fields[fieldname]["permlevel"] == 1
          driver_permissions = driver["permissions"]
          assert not any(row["role"] == "Fleet Manager" and row.get("permlevel") == 1 for row in driver_permissions)
          assert any(row["role"] == "Fleet Manager" and row.get("permlevel") == 2 and row.get("read") and row.get("write") for row in driver_permissions)
          assert not any(row["role"] == "Fleet Manager" and row.get("permlevel") == 3 for row in driver_permissions)
          assert not any(row["role"] == "Workshop" and row.get("permlevel", 0) > 0 for row in driver_permissions)
          for role in ("HR Manager", "System Manager"):
              assert any(row["role"] == role and row.get("permlevel") == 1 and row.get("read") and row.get("write") for row in driver_permissions)
              assert any(row["role"] == role and row.get("permlevel") == 2 and row.get("read") and row.get("write") for row in driver_permissions)
              assert any(row["role"] == role and row.get("permlevel") == 3 and row.get("read") and row.get("write") for row in driver_permissions)
          assert "_validate_supervisor" in inspection_controller
          assert "Only an Active Driver can be assigned" in inspection_controller
          assert "def before_cancel" in inspection_controller and "has_critical_defect" in inspection_controller
          assert "_validate_system_managed_fields" in inspection_controller
          task_controller = Path("sotrama/tp/doctype/operational_task/operational_task.py").read_text(encoding="utf-8")
          assert "_validate_supervisor" in task_controller
          assert 'getattr(self, "_action", None) == "submit"' in task_controller
          vehicle_controller = Path("sotrama/tp/doctype/vehicle/vehicle.py").read_text(encoding="utf-8")
          assert "_validate_safety_hold" in vehicle_controller
          assert "_validate_company_ownership" in vehicle_controller
          assert "get_open_vehicle_safety_holds" in vehicle_controller
          assert 'getattr(self, "_action", None) == "submit"' in vehicle_controller
          breakdown_controller = Path("sotrama/tp/doctype/breakdown_incident/breakdown_incident.py").read_text(encoding="utf-8")
          assert '@frappe.whitelist(methods=["POST"])\ndef update_breakdown_status' in breakdown_controller
          assert 'self.status not in ("Resolved", "Closed")' in breakdown_controller
          assert "_validate_system_managed_fields" in breakdown_controller
          assert "Resolution Notes are required" in breakdown_controller
          assert "BREAKDOWN_STATUS_TRANSITIONS" in breakdown_controller
          driver_controller = Path("sotrama/tp/doctype/driver/driver.py").read_text(encoding="utf-8")
          assert '@frappe.whitelist(methods=["POST"])\ndef update_driver_status' in driver_controller
          assert "DRIVER_STATUS_TRANSITIONS" in driver_controller
          assert "_validate_company_ownership" in driver_controller
          assert "License Number is required" not in driver_controller
          driver_js = Path("sotrama/public/js/driver.js").read_text(encoding="utf-8")
          assert "cell_number" not in driver_js and "personal_email" not in driver_js
          assert "phone: message." not in driver_js
          assert "values.email = message.company_email" in driver_js
          schedule_controller = Path("sotrama/tp/doctype/maintenance_schedule/maintenance_schedule.py").read_text(encoding="utf-8")
          assert '@frappe.whitelist(methods=["POST"])\ndef update_maintenance_schedule_status' in schedule_controller
          assert "def before_cancel(self)" in schedule_controller
          assert "MAINTENANCE_SCHEDULE_STATUS_TRANSITIONS" in schedule_controller
          assert "Record the last service odometer before completing" in schedule_controller
          validation_controller = Path("sotrama/tp/validation.py").read_text(encoding="utf-8")
          assert "def get_open_vehicle_safety_holds" in validation_controller
          assert "current driving licence number, category and expiry" in validation_controller
          assert "def prevent_submitted_fleet_record_deletion" in validation_controller
          tp_settings = json.loads(Path("sotrama/tp/doctype/tp_settings/tp_settings.json").read_text(encoding="utf-8"))
          tp_setting_fields = {field["fieldname"]: field for field in tp_settings["fields"]}
          assert tp_setting_fields["block_expired_driver_license"]["default"] == "0"
          for fieldname in ("default_company", "default_company_classification", "default_department", "default_cost_center", "default_parts_warehouse", "company_defaults"):
              assert tp_setting_fields[fieldname]["permlevel"] == 2
          assert any(row["role"] == "System Manager" and row.get("permlevel") == 2 and row.get("read") and row.get("write") for row in tp_settings["permissions"])
          for role in ("Fleet Manager", "HR Manager", "Workshop"):
              assert not any(row["role"] == role and row.get("permlevel") == 2 for row in tp_settings["permissions"])
          tp_settings_controller = Path("sotrama/tp/doctype/tp_settings/tp_settings.py").read_text(encoding="utf-8")
          assert "_validate_company_defaults_permissions" in tp_settings_controller
          tp_settings_api = Path("sotrama/tp/settings.py").read_text(encoding="utf-8")
          assert "def get_tp_default_company" in tp_settings_api
          assert "validate_company_access(company, applicable_for)" in tp_settings_api
          permissions_source = Path("sotrama/permissions.py").read_text(encoding="utf-8")
          hooks_source = Path("sotrama/hooks.py").read_text(encoding="utf-8")
          assert "get_single_value_with_tp_settings_field_permissions" in permissions_source
          assert "get_value_with_tp_settings_field_permissions" in permissions_source
          assert "isinstance(filters, dict) or filters" in permissions_source
          assert "validate_link_and_fetch_without_tp_settings_singleton" in permissions_source
          assert "get_list_with_tp_settings_permissions" in permissions_source
          assert "tp_company_defaults_query_conditions" in permissions_source
          assert "tp_settings_query_conditions" in permissions_source
          assert "prevent_unsafe_fleet_docsharing" in permissions_source
          assert "remove_unsafe_fleet_docshares" in permissions_source
          assert "COMPANY_SCOPED_FLEET_DOCTYPES" in permissions_source
          assert '"frappe.client.get_single_value": "sotrama.permissions.get_single_value_with_tp_settings_field_permissions"' in hooks_source
          assert '"frappe.client.get_value": "sotrama.permissions.get_value_with_tp_settings_field_permissions"' in hooks_source
          assert '"frappe.client.get_list": "sotrama.permissions.get_list_with_tp_settings_permissions"' in hooks_source
          assert '"frappe.client.validate_link_and_fetch": "sotrama.permissions.validate_link_and_fetch_without_tp_settings_singleton"' in hooks_source
          tp_settings_source = Path("sotrama/tp/settings.py").read_text(encoding="utf-8")
          assert "_get_accessible_company_default" in tp_settings_source
          assert 'frappe.has_permission(doctype, "read", doc=value)' in tp_settings_source
          assert 'frappe.has_permission("Vehicle", "create", throw=True)' in tp_settings_source
          assert 'frappe.has_permission(applicable_for, "create", throw=True)' in tp_settings_source
          assert '"DocShare": {' in hooks_source
          assert '"before_insert": "sotrama.permissions.prevent_unsafe_fleet_docsharing"' in hooks_source
          assert '"before_save": "sotrama.permissions.prevent_unsafe_fleet_docsharing"' in hooks_source
          assert '"Company Classification": {' in hooks_source
          for path in (
              "sotrama/tp/doctype/vehicle/vehicle.json",
              "sotrama/tp/doctype/driver/driver.json",
              "sotrama/tp/doctype/vehicle_inspection/vehicle_inspection.json",
              "sotrama/tp/doctype/breakdown_incident/breakdown_incident.json",
              "sotrama/tp/doctype/operational_task/operational_task.json",
              "sotrama/tp/doctype/maintenance_schedule/maintenance_schedule.json",
              "sotrama/tp/doctype/maintenance_job_card/maintenance_job_card.json",
              "sotrama/tp/doctype/company_classification/company_classification.json",
          ):
              permissions = json.loads(Path(path).read_text(encoding="utf-8"))["permissions"]
              system_manager = next(
                  row for row in permissions
                  if row["role"] == "System Manager" and row.get("permlevel", 0) == 0
              )
              assert system_manager.get("share") == 1, path
              assert all(
                  row["role"] == "System Manager"
                  for row in permissions
                  if row.get("share")
              ), path
              for role in ("Fleet Manager", "Workshop", "HRMS Employee"):
                  assert not any(row["role"] == role and row.get("share") for row in permissions), path
          tp_settings_permissions = json.loads(
              Path("sotrama/tp/doctype/tp_settings/tp_settings.json").read_text(encoding="utf-8")
          )["permissions"]
          assert not any(row.get("share") for row in tp_settings_permissions)
          assert "ignore_share_permissions=True" in permissions_source
          assert 'doc.get("everyone")' in permissions_source
          scheduler_source = Path("sotrama/tp/scheduler/__init__.py").read_text(encoding="utf-8")
          assert "def _user_for_role(" in scheduler_source
          assert "role_users_cache=None" in scheduler_source
          assert "known_existing=False" in scheduler_source
          scheduler_tree = ast.parse(scheduler_source)
          scheduler_role_scopes = {
              (call.args[0].value, call.args[1].value)
              for call in ast.walk(scheduler_tree)
              if isinstance(call, ast.Call)
              and isinstance(call.func, ast.Name)
              and call.func.id == "_user_for_role"
              and len(call.args) >= 2
              and isinstance(call.args[0], ast.Constant)
              and isinstance(call.args[1], ast.Constant)
          }
          assert {
              ("Fleet Manager", "Vehicle"),
              ("Fleet Manager", "Maintenance Schedule"),
              ("Fleet Manager", "Driver"),
              ("HR Manager", "Driver"),
          } <= scheduler_role_scopes
          assert 'fields=["name", "driver_name", "license_expiry", "safety_training_expiry"]' in scheduler_source
          assert "(License: {1})" not in scheduler_source
          assert '"Driver {0} safety training expires on {1}."' in scheduler_source
          assert "test_single_value_and_value_endpoints_enforce_tp_settings_permlevels" in Path("sotrama/tests/test_sotrama.py").read_text(encoding="utf-8")
          assert "test_driver_alerts_do_not_disclose_licence_number_or_safety_expiry_to_fleet" in Path("sotrama/tests/test_sotrama.py").read_text(encoding="utf-8")
          assert "test_maintenance_job_card_breakdown_links_are_workflow_managed_and_company_scoped" in Path("sotrama/tests/test_sotrama.py").read_text(encoding="utf-8")
          assert "validate_linked_document_read_permission" in Path("sotrama/tp/validation.py").read_text(encoding="utf-8")
          job_card_controller = Path("sotrama/tp/doctype/maintenance_job_card/maintenance_job_card.py").read_text(encoding="utf-8")
          assert 'validate_linked_document_read_permission(' in job_card_controller
          assert '"Breakdown Incident", incident_name' in job_card_controller
          assert 'validate_company_access(driver.company, "Driver")' in Path("sotrama/tp/validation.py").read_text(encoding="utf-8")
          assert 'validate_company_access(driver.company, "Employee")' in Path("sotrama/tp/validation.py").read_text(encoding="utf-8")
          assert 'validate_company_access(vehicle_company, "Vehicle")' in Path("sotrama/tp/doctype/vehicle_inspection/vehicle_inspection.py").read_text(encoding="utf-8")
          assert 'validate_company_access(project_company, "Project")' in Path("sotrama/tp/doctype/operational_task/operational_task.py").read_text(encoding="utf-8")
          for path in (
              "sotrama/tp/doctype/vehicle/vehicle.py",
