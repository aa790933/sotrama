[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "sotrama"
authors = [{name = "Sotrama"}]
description = "Algerian localization and industry extensions for Frappe"
requires-python = ">=3.14,<3.15"
license = "AGPL-3.0-only"
dependencies = []
dynamic = ["version"]

[tool.flit.module]
name = "sotrama"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
